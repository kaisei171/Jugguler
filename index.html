<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ジャグラー分析レポート</title>
  <meta name="theme-color" content="#080c14">
  
  <!-- PWA 設定 -->
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/192/1055/1055687.png">

  <!-- スタイル & フォント -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800;900&family=Alfa+Slab+One&display=swap" rel="stylesheet">
  
  <style>
    body {
      font-family: 'M PLUS Rounded 1c', sans-serif;
      background-color: #080c14;
      color: #f3f4f6;
      -webkit-tap-highlight-color: transparent;
    }

    /* 実機風 GOGO! ランプ バッジ */
    .gogo-lamp-badge {
      background: radial-gradient(circle, #24091c 0%, #050206 100%);
      border: 1.5px solid #3d1430;
      box-shadow: inset 0 0 8px rgba(0,0,0,0.9), 0 0 14px rgba(255, 0, 85, 0.35);
    }

    /* GOGO! ネオン文字 */
    .gogo-text {
      font-family: 'Alfa Slab One', cursive;
      color: #fffb00;
      letter-spacing: -1px;
      text-shadow: 
        0 0 3px #ffffff,
        0 0 8px #ffea00,
        0 0 16px #ff0055,
        0 0 28px #ff0055,
        0 0 40px #cc0033;
      transform: skew(-6deg);
    }

    .chance-text {
      font-family: 'Arial Black', sans-serif;
      font-size: 8px;
      letter-spacing: 2px;
      color: #ffffff;
      text-shadow: 0 0 4px #ff0055, 0 0 8px #ff0055;
    }
  </style>
</head>
<body class="pb-24">

  <!-- ヘッダー -->
  <header class="bg-gray-950/95 backdrop-blur border-b border-gray-800 px-3 py-2 sticky top-0 z-30 flex justify-between items-center shadow-2xl">
    
    <!-- GOGO! CHANCE ランプ風ロゴ -->
    <div class="flex items-center gap-2">
      <div class="gogo-lamp-badge px-3 py-1.5 rounded-xl flex flex-col items-center justify-center select-none">
        <span class="gogo-text text-base sm:text-lg font-black leading-none">GOGO!</span>
        <span class="chance-text uppercase font-black leading-none mt-0.5">CHANCE</span>
      </div>
      <span class="text-xs text-gray-400 font-bold tracking-wider ml-1 border-l border-gray-800 pl-2">分析レポート</span>
    </div>

    <!-- 保存・復元 -->
    <div class="flex gap-1.5">
      <button onclick="exportData()" class="px-2.5 py-1.5 bg-gray-900 border border-gray-700/80 hover:border-amber-400 rounded-lg text-xs font-bold text-amber-400 transition shadow">保存</button>
      <label class="px-2.5 py-1.5 bg-gray-900 border border-gray-700/80 hover:border-blue-400 rounded-lg text-xs font-bold text-blue-400 cursor-pointer transition shadow">
        復元<input type="file" onchange="importData(event)" class="hidden" accept=".json">
      </label>
    </div>
  </header>

  <!-- メインコンテンツ -->
  <main class="max-w-md mx-auto p-4 space-y-5">

    <!-- 実戦記録フォーム -->
    <section class="space-y-3">
      <div class="bg-gray-900/90 border border-gray-800 rounded-2xl p-4 shadow-xl">
        <h2 class="text-xs font-bold text-amber-400 mb-3 flex items-center gap-1.5">
          <span class="inline-block w-2 h-2 rounded-full bg-amber-400 animate-pulse"></span>
          本日の実戦を記録
        </h2>
        
        <form id="recordForm" onsubmit="handleSave(event)" class="space-y-3">
          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="text-[11px] text-gray-400 font-bold">実戦日</label>
              <input type="date" id="date" required class="w-full bg-gray-800 border border-gray-700 rounded-xl px-2.5 py-2 text-xs text-white focus:outline-none focus:border-rose-500">
            </div>
            <div>
              <label class="text-[11px] text-gray-400 font-bold">機種名</label>
              <select id="model" class="w-full bg-gray-800 border border-gray-700 rounded-xl px-2.5 py-2 text-xs text-white focus:outline-none focus:border-rose-500">
                <option value="マイジャグラーV">マイジャグラーV</option>
                <option value="アイムジャグラーEX">アイムジャグラーEX</option>
                <option value="ファンキージャグラー2">ファンキージャグラー2</option>
                <option value="ゴーゴージャグラー3">ゴーゴージャグラー3</option>
                <option value="ハッピージャグラーV III">ハッピージャグラーV III</option>
                <option value="ミスタージャグラー">ミスタージャグラー</option>
              </select>
            </div>
          </div>

          <div>
            <label class="text-[11px] text-gray-400 font-bold">ホール・店舗名</label>
            <input type="text" id="hall" required placeholder="モナコパレス菊陽" class="w-full bg-gray-800 border border-gray-700 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-rose-500">
          </div>

          <!-- G数・ボーナス -->
          <div class="bg-gray-800/40 p-3 rounded-xl space-y-1.5 border border-gray-700/50">
            <div class="grid grid-cols-3 gap-2">
              <div>
                <label class="text-[10px] text-gray-400 block text-center">総回転数</label>
                <input type="number" id="games" placeholder="591" class="w-full bg-gray-900 border border-gray-700 rounded-lg py-1.5 text-xs text-white text-center font-bold focus:border-rose-500">
              </div>
              <div>
                <label class="text-[10px] text-rose-400 block text-center font-bold">BIG回数</label>
                <input type="number" id="big" placeholder="6" class="w-full bg-gray-900 border border-gray-700 rounded-lg py-1.5 text-xs text-white text-center font-bold focus:border-rose-500">
              </div>
              <div>
                <label class="text-[10px] text-amber-400 block text-center font-bold">REG回数</label>
                <input type="number" id="reg" placeholder="2" class="w-full bg-gray-900 border border-gray-700 rounded-lg py-1.5 text-xs text-white text-center font-bold focus:border-rose-500">
              </div>
            </div>
          </div>

          <!-- 着席時状況 -->
          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="text-[11px] text-gray-400">着席時ハマり (G)</label>
              <input type="number" id="startHamari" placeholder="435" class="w-full bg-gray-800 border border-gray-700 rounded-xl px-3 py-2 text-xs text-white focus:outline-none">
            </div>
            <div>
              <label class="text-[11px] text-gray-400">着席時差枚 (枚)</label>
              <input type="number" id="startDiff" placeholder="-1400" class="w-full bg-gray-800 border border-gray-700 rounded-xl px-3 py-2 text-xs text-white focus:outline-none">
            </div>
          </div>

          <!-- 投資・回収 -->
          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="text-[11px] text-gray-400">投資 (円)</label>
              <input type="number" id="invest" required placeholder="5000" class="w-full bg-gray-800 border border-gray-700 rounded-xl px-3 py-2 text-xs text-white focus:outline-none">
            </div>
            <div>
              <label class="text-[11px] text-gray-400">回収 (円)</label>
              <input type="number" id="collect" required placeholder="25000" class="w-full bg-gray-800 border border-gray-700 rounded-xl px-3 py-2 text-xs text-white focus:outline-none">
            </div>
          </div>

          <button type="submit" class="w-full bg-gradient-to-r from-rose-600 to-rose-700 hover:from-rose-500 hover:to-rose-600 text-white font-bold py-3 rounded-xl shadow-lg mt-2 text-xs tracking-wider active:scale-[0.99] transition-transform">
            実戦記録を保存する
          </button>
        </form>
      </div>
    </section>

    <!-- レポートエリア（3部構成） -->
    <section class="space-y-4">
      <div class="flex justify-between items-center px-1">
        <h2 class="text-sm font-bold text-white tracking-wide">ジャグラー分析レポート</h2>
        <span class="text-xs text-gray-400" id="reportCount">0件</span>
      </div>

      <!-- 1. 実戦サマリー -->
      <div class="bg-gray-900 border border-gray-800 rounded-2xl p-4 space-y-3 shadow-md">
        <h3 class="text-xs font-bold text-rose-400 tracking-wider flex items-center gap-1.5">
          <span>■</span> 1. 直近の実戦サマリー
        </h3>
        <div id="latestSummary" class="text-xs space-y-2 text-gray-300">
          データがありません
        </div>
      </div>

      <!-- 2. 店舗別データ -->
      <div class="bg-gray-900 border border-gray-800 rounded-2xl p-4 space-y-3 shadow-md">
        <h3 class="text-xs font-bold text-amber-400 tracking-wider flex items-center gap-1.5">
          <span>■</span> 2. 店舗別データ
        </h3>
        <div class="overflow-x-auto">
          <table class="w-full text-xs text-left text-gray-300">
            <thead class="text-gray-400 border-b border-gray-800">
              <tr>
                <th class="py-2">店舗名</th>
                <th class="py-2 text-center">戦績</th>
                <th class="py-2 text-right">累計収支</th>
              </tr>
            </thead>
            <tbody id="hallStatsTable"></tbody>
          </table>
        </div>
      </div>

      <!-- 3. 生涯収支推移 -->
      <div class="bg-gray-900 border border-gray-800 rounded-2xl p-4 space-y-3 shadow-md">
        <h3 class="text-xs font-bold text-emerald-400 tracking-wider flex items-center gap-1.5">
          <span>■</span> 3. 生涯収支推移
        </h3>
        <div class="grid grid-cols-2 gap-2 text-center py-2.5 bg-gray-800/40 rounded-xl border border-gray-800">
          <div>
            <div class="text-[10px] text-gray-400">通算戦績</div>
            <div class="text-xs font-bold text-white mt-0.5" id="totalRecord">0戦 0勝</div>
          </div>
          <div>
            <div class="text-[10px] text-gray-400">生涯総収支</div>
            <div class="text-sm font-black mt-0.5" id="totalIncome">±0円</div>
          </div>
        </div>
        <div class="h-44 pt-2">
          <canvas id="profitChart"></canvas>
        </div>
      </div>
    </section>

  </main>

  <script>
    // PWA Service Worker 登録
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js')
          .then(reg => console.log('Service Worker 登録成功:', reg))
          .catch(err => console.error('Service Worker 登録失敗:', err));
      });
    }

    // 初回データ
    const defaultData = [{
      id: 1,
      date: '2026-10-23',
      hall: 'モナコパレス菊陽',
      model: 'マイジャグラーV',
      games: 591,
      big: 6,
      reg: 2,
      startHamari: 435,
      startDiff: -1400,
      invest: 5000,
      collect: 25000,
      diff: 20000
    }];

    let records = JSON.parse(localStorage.getItem('juggler_records')) || defaultData;
    let chartInstance = null;

    document.getElementById('date').value = new Date().toISOString().split('T')[0];

    function handleSave(e) {
      e.preventDefault();
      const rec = {
        id: Date.now(),
        date: document.getElementById('date').value,
        hall: document.getElementById('hall').value,
        model: document.getElementById('model').value,
        games: Number(document.getElementById('games').value) || 0,
        big: Number(document.getElementById('big').value) || 0,
        reg: Number(document.getElementById('reg').value) || 0,
        startHamari: Number(document.getElementById('startHamari').value) || 0,
        startDiff: Number(document.getElementById('startDiff').value) || 0,
        invest: Number(document.getElementById('invest').value) || 0,
        collect: Number(document.getElementById('collect').value) || 0,
      };
      rec.diff = rec.collect - rec.invest;
      records.unshift(rec);
      localStorage.setItem('juggler_records', JSON.stringify(records));
      e.target.reset();
      document.getElementById('date').value = new Date().toISOString().split('T')[0];
      render();
    }

    function render() {
      document.getElementById('reportCount').textContent = records.length + '件';

      // 1. 直近サマリー
      if (records.length > 0) {
        const r = records[0];
        const g = r.games || 0;
        const bProb = r.big > 0 ? (g / r.big).toFixed(1) : '-';
        const rProb = r.reg > 0 ? (g / r.reg).toFixed(1) : '-';
        const tProb = (r.big + r.reg) > 0 ? (g / (r.big + r.reg)).toFixed(1) : '-';
        const isWin = r.diff >= 0;

        document.getElementById('latestSummary').innerHTML = `
          <div class="flex justify-between items-baseline border-b border-gray-800 pb-2">
            <div>
              <span class="font-bold text-white text-sm">${r.hall}</span>
              <span class="text-[11px] text-gray-400 ml-1">(${r.model})</span>
            </div>
            <span class="font-bold text-sm ${isWin ? 'text-rose-400' : 'text-blue-400'}">${isWin ? '+' : ''}${r.diff.toLocaleString()}円</span>
          </div>
          <div class="grid grid-cols-2 gap-y-1.5 text-xs text-gray-400 pt-1">
            <div>日付: <span class="text-white">${r.date}</span></div>
            <div>総G数: <span class="text-white">${g}G</span></div>
            <div>合算確率: <span class="text-amber-400 font-bold">1/${tProb}</span></div>
            <div>BIG: <span class="text-white">${r.big}回 (1/${bProb})</span></div>
            <div>REG: <span class="text-white">${r.reg}回 (1/${rProb})</span></div>
            <div>着席時: <span class="text-white">${r.startHamari}G / ${r.startDiff}枚</span></div>
            <div>投資 / 回収: <span class="text-white">${r.invest.toLocaleString()}円 / ${r.collect.toLocaleString()}円</span></div>
          </div>
        `;
      }

      // 2. 店舗別データ
      const hallMap = {};
      records.forEach(r => {
        if (!hallMap[r.hall]) hallMap[r.hall] = { wins: 0, total: 0, profit: 0 };
        hallMap[r.hall].total++;
        if (r.diff > 0) hallMap[r.hall].wins++;
        hallMap[r.hall].profit += r.diff;
      });

      let tableHtml = '';
      for (const [hall, d] of Object.entries(hallMap)) {
        const rate = ((d.wins / d.total) * 100).toFixed(0);
        const win = d.profit >= 0;
        tableHtml += `
          <tr class="border-b border-gray-800/60">
            <td class="py-2.5 font-medium text-white">${hall}</td>
            <td class="py-2.5 text-center">${d.wins}勝${d.total - d.wins}敗 (${rate}%)</td>
            <td class="py-2.5 text-right font-bold ${win ? 'text-rose-400' : 'text-blue-400'}">${win ? '+' : ''}${d.profit.toLocaleString()}円</td>
          </tr>
        `;
      }
      document.getElementById('hallStatsTable').innerHTML = tableHtml;

      // 3. 生涯収支推移
      let sum = 0;
      let wins = 0;
      const chronological = [...records].reverse();
      const labels = [];
      const dataPoints = [];

      chronological.forEach((r, idx) => {
        sum += r.diff;
        if (r.diff > 0) wins++;
        labels.push(idx + 1 + '回');
        dataPoints.push(sum);
      });

      const winRate = records.length > 0 ? ((wins / records.length) * 100).toFixed(1) : 0;
      document.getElementById('totalRecord').textContent = `${records.length}戦 ${wins}勝 (${winRate}%)`;
      const totElem = document.getElementById('totalIncome');
      totElem.textContent = (sum >= 0 ? '+' : '') + sum.toLocaleString() + '円';
      totElem.className = 'text-sm font-black mt-0.5 ' + (sum >= 0 ? 'text-rose-400' : 'text-blue-400');

      if (chartInstance) chartInstance.destroy();
      const ctx = document.getElementById('profitChart').getContext('2d');
      chartInstance = new Chart(ctx, {
        type: 'line',
        data: {
          labels: labels,
          datasets: [{
            data: dataPoints,
            borderColor: '#ff0055',
            backgroundColor: 'rgba(255, 0, 85, 0.12)',
            fill: true,
            tension: 0.3,
            borderWidth: 2.5,
            pointRadius: 3,
            pointBackgroundColor: '#fffb00'
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { display: false } },
          scales: {
            x: { grid: { color: '#1f2937' }, ticks: { color: '#9ca3af', font: { size: 10 } } },
            y: { grid: { color: '#1f2937' }, ticks: { color: '#9ca3af', font: { size: 10 } } }
          }
        }
      });
    }

    function exportData() {
      const blob = new Blob([JSON.stringify(records, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `juggler_backup_${new Date().toISOString().split('T')[0]}.json`;
      a.click();
    }

    function importData(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        records = JSON.parse(ev.target.result);
        localStorage.setItem('juggler_records', JSON.stringify(records));
        render();
      };
      reader.readAsText(file);
    }

    render();
  </script>
</body>
</html>
