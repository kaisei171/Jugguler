<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ジャグラー分析レポート</title>
  <meta name="theme-color" content="#111827">
  
  <!-- PWA アプリ化設定 -->
  <link rel="manifest" href="data:application/manifest+json;charset=utf-8,%7B%22name%22%3A%22%E3%82%B8%E3%83%A3%E3%82%B0%E3%83%A9%E3%83%BC%E5%88%86%E6%9E%90%22%2C%22short_name%22%3A%22%E3%82%B8%E3%83%A3%E3%82%B0%E3%83%A9%E3%83%BC%22%2C%22start_url%22%3A%22.%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%23111827%22%2C%22theme_color%22%3A%22%23111827%22%2C%22icons%22%3A%5B%7B%22src%22%3A%22https%3A%2F%2Fapi.iconify.design%2Fsolar%3Achart-bold.svg%3Fcolor%3D%2523f59e0b%22%2C%22sizes%22%3A%22192x192%22%2C%22type%22%3A%22image%2Fsvg%2Bxml%22%7D%5D%7D">

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&family=Chango&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'M PLUS Rounded 1c', sans-serif; background-color: #0b0f19; color: #f3f4f6; }
    .gogo-font { font-family: 'Chango', cursive; }
  </style>
</head>
<body class="pb-24">

  <!-- ヘッダー -->
  <header class="bg-gray-900 border-b border-gray-800 p-4 sticky top-0 z-30 flex justify-between items-center">
    <div class="flex items-center gap-2">
      <span class="text-rose-500 text-xl font-black italic tracking-tighter gogo-font">GOGO!</span>
      <h1 class="text-lg font-bold text-white">ジャグラー分析</h1>
    </div>
    <div class="flex gap-2">
      <button onclick="exportData()" class="p-2 bg-gray-800 hover:bg-gray-700 rounded-lg text-xs font-bold text-amber-400">保存</button>
      <label class="p-2 bg-gray-800 hover:bg-gray-700 rounded-lg text-xs font-bold text-blue-400 cursor-pointer">
        復元<input type="file" onchange="importData(event)" class="hidden" accept=".json">
      </label>
    </div>
  </header>

  <!-- メインコンテンツ -->
  <main class="max-w-md mx-auto p-4 space-y-6">

    <!-- 入力セクション -->
    <section id="sec-input" class="space-y-4">
      <div class="bg-gray-900/90 border border-gray-800 rounded-2xl p-4 shadow-xl">
        <h2 class="text-base font-bold text-amber-400 mb-3 flex items-center gap-2">
          <span>●</span> 実戦記録の追加
        </h2>
        
        <form id="recordForm" onsubmit="handleSave(event)" class="space-y-3">
          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="text-xs text-gray-400">日付</label>
              <input type="date" id="date" required class="w-full bg-gray-800 border border-gray-700 rounded-xl px-3 py-2 text-sm text-white">
            </div>
            <div>
              <label class="text-xs text-gray-400">機種</label>
              <select id="model" class="w-full bg-gray-800 border border-gray-700 rounded-xl px-3 py-2 text-sm text-white">
                <option value="マイジャグラーV">マイジャグラーV</option>
                <option value="アイムジャグラーEX">アイムジャグラーEX</option>
                <option value="ファンキージャグラー2">ファンキージャグラー2</option>
                <option value="ゴーゴージャグラー3">ゴーゴージャグラー3</option>
                <option value="ハッピージャグラーV III">ハッピージャグラーV III</option>
                <option value="ミスタージャグラー">ミスタージャグラー</option>
              </select>
            </div>
          </div>

          <div>
            <label class="text-xs text-gray-400">ホール・店舗名</label>
            <input type="text" id="hall" required placeholder="モナコパレス菊陽" class="w-full bg-gray-800 border border-gray-700 rounded-xl px-3 py-2 text-sm text-white">
          </div>

          <!-- G数・ボーナス -->
          <div class="bg-gray-800/50 p-3 rounded-xl space-y-2 border border-gray-700/50">
            <div class="grid grid-cols-3 gap-2">
              <div>
                <label class="text-xs text-gray-400">総回転数</label>
                <input type="number" id="games" placeholder="591" class="w-full bg-gray-900 border border-gray-700 rounded-lg px-2 py-1.5 text-sm text-white text-center">
              </div>
              <div>
                <label class="text-xs text-rose-400 font-bold">BIG回数</label>
                <input type="number" id="big" placeholder="6" class="w-full bg-gray-900 border border-gray-700 rounded-lg px-2 py-1.5 text-sm text-white text-center">
              </div>
              <div>
                <label class="text-xs text-amber-400 font-bold">REG回数</label>
                <input type="number" id="reg" placeholder="2" class="w-full bg-gray-900 border border-gray-700 rounded-lg px-2 py-1.5 text-sm text-white text-center">
              </div>
            </div>
          </div>

          <!-- 着席時状況 -->
          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="text-xs text-gray-400">着席時ハマり (G)</label>
              <input type="number" id="startHamari" placeholder="435" class="w-full bg-gray-800 border border-gray-700 rounded-xl px-3 py-2 text-sm text-white">
            </div>
            <div>
              <label class="text-xs text-gray-400">着席時差枚 (枚)</label>
              <input type="number" id="startDiff" placeholder="-1400" class="w-full bg-gray-800 border border-gray-700 rounded-xl px-3 py-2 text-sm text-white">
            </div>
          </div>

          <!-- 投資・回収 -->
          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="text-xs text-gray-400">投資 (円)</label>
              <input type="number" id="invest" required placeholder="5000" class="w-full bg-gray-800 border border-gray-700 rounded-xl px-3 py-2 text-sm text-white">
            </div>
            <div>
              <label class="text-xs text-gray-400">回収 (円)</label>
              <input type="number" id="collect" required placeholder="25000" class="w-full bg-gray-800 border border-gray-700 rounded-xl px-3 py-2 text-sm text-white">
            </div>
          </div>

          <button type="submit" class="w-full bg-rose-600 hover:bg-rose-500 text-white font-bold py-3 rounded-xl shadow-lg mt-2">
            実戦記録を保存する
          </button>
        </form>
      </div>
    </section>

    <!-- レポートセクション -->
    <section id="sec-report" class="space-y-4">
      <div class="flex justify-between items-center">
        <h2 class="text-lg font-black text-white">ジャグラー分析レポート</h2>
        <span class="text-xs text-gray-400" id="reportCount">0件の記録</span>
      </div>

      <!-- PART 1: 実戦サマリー -->
      <div class="bg-gray-900 border border-gray-800 rounded-2xl p-4 space-y-3">
        <h3 class="text-xs font-bold text-rose-400 tracking-wider">1. 直近の実戦サマリー</h3>
        <div id="latestSummary" class="text-sm space-y-2 text-gray-300">
          データがありません
        </div>
      </div>

      <!-- PART 2: 店舗別データ -->
      <div class="bg-gray-900 border border-gray-800 rounded-2xl p-4 space-y-3">
        <h3 class="text-xs font-bold text-amber-400 tracking-wider">2. 店舗別データ</h3>
        <div class="overflow-x-auto">
          <table class="w-full text-xs text-left text-gray-300">
            <thead class="text-gray-400 border-b border-gray-800">
              <tr>
                <th class="py-2">店舗名</th>
                <th class="py-2 text-center">戦績</th>
                <th class="py-2 text-right">累計収支</th>
              </tr>
            </thead>
            <tbody id="hallStatsTable"></tbody>
          </table>
        </div>
      </div>

      <!-- PART 3: 生涯収支推移 -->
      <div class="bg-gray-900 border border-gray-800 rounded-2xl p-4 space-y-3">
        <h3 class="text-xs font-bold text-emerald-400 tracking-wider">3. 生涯収支推移</h3>
        <div class="grid grid-cols-2 gap-2 text-center py-2 bg-gray-800/40 rounded-xl">
          <div>
            <div class="text-[10px] text-gray-400">通算戦績</div>
            <div class="text-sm font-bold text-white" id="totalRecord">0戦 0勝</div>
          </div>
          <div>
            <div class="text-[10px] text-gray-400">生涯総収支</div>
            <div class="text-base font-black" id="totalIncome">±0円</div>
          </div>
        </div>
        <div class="h-48 pt-2">
          <canvas id="profitChart"></canvas>
        </div>
      </div>
    </section>

  </main>

  <script>
    // PWA インストールを可能にするダミー Service Worker の即時登録
    if ('serviceWorker' in navigator) {
      const swCode = "self.addEventListener('fetch', () => {});";
      const blob = new Blob([swCode], { type: 'application/javascript' });
      navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(() => {});
    }

    // 初回データ
    const defaultData = [{
      id: 1,
      date: '2026-10-23',
      hall: 'モナコパレス菊陽',
      model: 'マイジャグラーV',
      games: 591,
      big: 6,
      reg: 2,
      startHamari: 435,
      startDiff: -1400,
      invest: 5000,
      collect: 25000,
      diff: 20000
    }];

    let records = JSON.parse(localStorage.getItem('juggler_records')) || defaultData;
    let chartInstance = null;

    document.getElementById('date').value = new Date().toISOString().split('T')[0];

    function handleSave(e) {
      e.preventDefault();
      const rec = {
        id: Date.now(),
        date: document.getElementById('date').value,
        hall: document.getElementById('hall').value,
        model: document.getElementById('model').value,
        games: Number(document.getElementById('games').value) || 0,
        big: Number(document.getElementById('big').value) || 0,
        reg: Number(document.getElementById('reg').value) || 0,
        startHamari: Number(document.getElementById('startHamari').value) || 0,
        startDiff: Number(document.getElementById('startDiff').value) || 0,
        invest: Number(document.getElementById('invest').value) || 0,
        collect: Number(document.getElementById('collect').value) || 0,
      };
      rec.diff = rec.collect - rec.invest;
      records.unshift(rec);
      localStorage.setItem('juggler_records', JSON.stringify(records));
      e.target.reset();
      document.getElementById('date').value = new Date().toISOString().split('T')[0];
      render();
    }

    function render() {
      document.getElementById('reportCount').textContent = records.length + '件の記録';

      // 1. 直近サマリー
      if (records.length > 0) {
        const r = records[0];
        const g = r.games || 0;
        const bProb = r.big > 0 ? (g / r.big).toFixed(1) : '-';
        const rProb = r.reg > 0 ? (g / r.reg).toFixed(1) : '-';
        const tProb = (r.big + r.reg) > 0 ? (g / (r.big + r.reg)).toFixed(1) : '-';
        const isWin = r.diff >= 0;

        document.getElementById('latestSummary').innerHTML = `
          <div class="flex justify-between items-baseline border-b border-gray-800 pb-2">
            <div>
              <span class="font-bold text-white text-base">${r.hall}</span>
              <span class="text-xs text-gray-400 ml-1">(${r.model})</span>
            </div>
            <span class="font-bold text-sm ${isWin ? 'text-rose-400' : 'text-blue-400'}">${isWin ? '+' : ''}${r.diff.toLocaleString()}円</span>
          </div>
          <div class="grid grid-cols-2 gap-y-1 text-xs text-gray-400 pt-1">
            <div>総G数: <span class="text-white">${g}G</span></div>
            <div>合算: <span class="text-amber-400 font-bold">1/${tProb}</span></div>
            <div>BIG: <span class="text-white">${r.big}回 (1/${bProb})</span></div>
            <div>REG: <span class="text-white">${r.reg}回 (1/${rProb})</span></div>
            <div>着席時: <span class="text-white">${r.startHamari}G / ${r.startDiff}枚</span></div>
            <div>投資/回収: <span class="text-white">${r.invest.toLocaleString()} / ${r.collect.toLocaleString()}円</span></div>
          </div>
        `;
      }

      // 2. 店舗別データ
      const hallMap = {};
      records.forEach(r => {
        if (!hallMap[r.hall]) hallMap[r.hall] = { wins: 0, total: 0, profit: 0 };
        hallMap[r.hall].total++;
        if (r.diff > 0) hallMap[r.hall].wins++;
        hallMap[r.hall].profit += r.diff;
      });

      let tableHtml = '';
      for (const [hall, d] of Object.entries(hallMap)) {
        const rate = ((d.wins / d.total) * 100).toFixed(0);
        const win = d.profit >= 0;
        tableHtml += `
          <tr class="border-b border-gray-800/60">
            <td class="py-2 font-medium text-white">${hall}</td>
            <td class="py-2 text-center">${d.wins}勝${d.total - d.wins}敗 (${rate}%)</td>
            <td class="py-2 text-right font-bold ${win ? 'text-rose-400' : 'text-blue-400'}">${win ? '+' : ''}${d.profit.toLocaleString()}円</td>
          </tr>
        `;
      }
      document.getElementById('hallStatsTable').innerHTML = tableHtml;

      // 3. 生涯収支 & グラフ
      let sum = 0;
      let wins = 0;
      const chronological = [...records].reverse();
      const labels = [];
      const dataPoints = [];

      chronological.forEach((r, idx) => {
        sum += r.diff;
        if (r.diff > 0) wins++;
        labels.push(idx + 1 + '回');
        dataPoints.push(sum);
      });

      const winRate = records.length > 0 ? ((wins / records.length) * 100).toFixed(1) : 0;
      document.getElementById('totalRecord').textContent = `${records.length}戦 ${wins}勝 (${winRate}%)`;
      const totElem = document.getElementById('totalIncome');
      totElem.textContent = (sum >= 0 ? '+' : '') + sum.toLocaleString() + '円';
      totElem.className = 'text-base font-black ' + (sum >= 0 ? 'text-rose-400' : 'text-blue-400');

      if (chartInstance) chartInstance.destroy();
      const ctx = document.getElementById('profitChart').getContext('2d');
      chartInstance = new Chart(ctx, {
        type: 'line',
        data: {
          labels: labels,
          datasets: [{
            data: dataPoints,
            borderColor: '#f43f5e',
            backgroundColor: 'rgba(244, 63, 94, 0.1)',
            fill: true,
            tension: 0.3,
            borderWidth: 2,
            pointRadius: 3
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { display: false } },
          scales: {
            x: { grid: { color: '#1f2937' }, ticks: { color: '#9ca3af', font: { size: 10 } } },
            y: { grid: { color: '#1f2937' }, ticks: { color: '#9ca3af', font: { size: 10 } } }
          }
        }
      });
    }

    function exportData() {
      const blob = new Blob([JSON.stringify(records, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `juggler_backup_${new Date().toISOString().split('T')[0]}.json`;
      a.click();
    }

    function importData(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        records = JSON.parse(ev.target.result);
        localStorage.setItem('juggler_records', JSON.stringify(records));
        render();
      };
      reader.readAsText(file);
    }

    render();
  </script>
</body>
</html>
