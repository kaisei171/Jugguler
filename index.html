<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>ジャグラー分析レポート</title>
  <!-- PWAとしてインストール可能にするための設定 -->
<link rel="manifest" href="data:application/manifest+json;charset=utf-8,%7B%22name%22%3A%22%E3%82%B8%E3%83%A3%E3%82%B0%E3%83%A9%E3%83%BC%E5%88%86%E6%9E%90%22%2C%22short_name%22%3A%22%E3%82%B8%E3%83%A3%E3%82%B0%E3%83%A9%E3%83%BC%22%2C%22start_url%22%3A%22.%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%23111827%22%2C%22theme_color%22%3A%22%23111827%22%2C%22icons%22%3A%5B%7B%22src%22%3A%22https%3A%2F%2Fapi.iconify.design%2Fsolar%3Achart-bold.svg%3Fcolor%3D%2523f59e0b%22%2C%22sizes%22%3A%22192x192%22%2C%22type%22%3A%22image%2Fsvg%2Bxml%22%7D%5D%7D">
  <!-- Web App Meta -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ジャグラー分析">
  <meta name="theme-color" content="#090a10">
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body {
      background-color: #0b0d14;
      color: #f3f4f6;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
      -webkit-tap-highlight-color: transparent;
      padding-bottom: env(safe-area-inset-bottom, 70px);
    }
    .gogo-neon {
      text-shadow: 0 0 10px #ff0055, 0 0 20px #ff0055, 0 0 35px #ff0077;
    }
    .gold-neon {
      text-shadow: 0 0 8px #f59e0b;
    }
    .tap-scale:active {
      transform: scale(0.97);
      transition: transform 0.08s ease;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between selection:bg-pink-500 selection:text-white">

  <!-- Top Mobile Bar -->
  <header class="bg-slate-950/95 border-b border-pink-900/40 sticky top-0 z-40 px-4 py-3 backdrop-blur-md shadow-md">
    <div class="max-w-md mx-auto flex items-center justify-between">
      <div class="flex items-center space-x-2">
        <span class="text-2xl font-black italic tracking-wider text-pink-500 gogo-neon leading-none select-none">GOGO!CHANCE</span>
        <div class="leading-tight">
          <div class="text-sm font-bold text-white flex items-center gap-1.5">
            <span>ジャグラー分析</span>
            <span class="text-[10px] px-1.5 py-0.2 rounded bg-pink-950 text-pink-400 border border-pink-700/60 font-mono">REPORT</span>
          </div>
        </div>
      </div>
      
      <!-- Backup / Restore Dropdown Trigger -->
      <div class="flex items-center gap-1.5">
        <button onclick="exportData()" class="p-2 rounded-xl bg-slate-900 text-slate-300 hover:text-white border border-slate-800 tap-scale flex items-center gap-1 text-xs" title="データを保存">
          <i data-lucide="download" class="w-4 h-4 text-pink-400"></i>
          <span class="hidden sm:inline">保存</span>
        </button>
        <button onclick="document.getElementById('fileInput').click()" class="p-2 rounded-xl bg-slate-900 text-slate-300 hover:text-white border border-slate-800 tap-scale flex items-center gap-1 text-xs" title="データを読み込み">
          <i data-lucide="upload" class="w-4 h-4 text-cyan-400"></i>
          <span class="hidden sm:inline">復元</span>
        </button>
        <input type="file" id="fileInput" class="hidden" accept=".json" onchange="importData(event)">
      </div>
    </div>
  </header>

  <!-- Notification Toast -->
  <div id="toast" class="fixed top-14 left-1/2 transform -translate-x-1/2 z-50 pointer-events-none opacity-0 transition-all duration-300 bg-slate-900/95 border border-pink-500/70 text-white px-4 py-2 rounded-full shadow-2xl flex items-center gap-2 text-xs font-semibold backdrop-blur">
    <i data-lucide="check-circle" class="w-4 h-4 text-pink-400"></i>
    <span id="toast-message">保存しました</span>
  </div>

  <!-- Main Mobile Container -->
  <main class="max-w-md mx-auto w-full px-3.5 pt-3 pb-24 flex-1">

    <!-- ================= PAGE 1: 記録入力 ================= -->
    <section id="pane-input" class="space-y-4">
      <div class="bg-slate-900/90 border border-slate-800/90 rounded-2xl p-4 shadow-xl relative overflow-hidden backdrop-blur">
        
        <div class="flex items-center justify-between border-b border-slate-800 pb-2.5 mb-3.5">
          <div class="flex items-center gap-2">
            <span class="w-2.5 h-2.5 rounded-full bg-pink-500 animate-pulse"></span>
            <h2 class="text-sm font-bold text-white tracking-wide">本日の実戦を記録</h2>
          </div>
          <span class="text-[11px] text-slate-400">自動計算対応</span>
        </div>

        <form id="recordForm" onsubmit="saveRecord(event)" class="space-y-3.5">

          <!-- 日付 & 機種 -->
          <div class="grid grid-cols-2 gap-2.5">
            <div>
              <label class="block text-[11px] text-slate-400 mb-1 font-semibold">実戦日 *</label>
              <input type="date" id="date" required class="w-full bg-slate-950 border border-slate-700/80 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-pink-500">
            </div>
            <div>
              <label class="block text-[11px] text-slate-400 mb-1 font-semibold">機種名 *</label>
              <select id="model" class="w-full bg-slate-950 border border-slate-700/80 rounded-xl px-2.5 py-2 text-xs text-pink-300 focus:outline-none focus:border-pink-500">
                <option value="マイジャグラーV">マイジャグラーV</option>
                <option value="アイムジャグラーEX">アイムジャグラーEX</option>
                <option value="ファンキージャグラー2">ファンキージャグラー2</option>
                <option value="ゴーゴージャグラー3">ゴーゴージャグラー3</option>
                <option value="ハッピージャグラーV III">ハッピージャグラーV III</option>
                <option value="ミスタージャグラー">ミスタージャグラー</option>
                <option value="その他ジャグラー">その他ジャグラー</option>
              </select>
            </div>
          </div>

          <!-- 店舗名 (履歴チップ付き) -->
          <div>
            <label class="block text-[11px] text-slate-400 mb-1 font-semibold">ホール・店舗名 *</label>
            <input type="text" id="store" list="storeList" placeholder="例: モナコパレス菊陽" required class="w-full bg-slate-950 border border-slate-700/80 rounded-xl px-3 py-2 text-xs text-white placeholder-slate-600 focus:outline-none focus:border-pink-500">
            <datalist id="storeList"></datalist>
            <!-- 履歴クイック選択タグ -->
            <div id="quickStores" class="flex flex-wrap gap-1.5 mt-1.5"></div>
          </div>

          <!-- G数 & ボーナス回数 -->
          <div class="bg-slate-950/70 p-3 rounded-xl border border-slate-800 space-y-2">
            <div class="flex items-center justify-between">
              <span class="text-[11px] font-bold text-pink-400">ボーナス & 回転数</span>
              <span class="text-[10px] text-slate-400">確率を自動計算</span>
            </div>

            <div class="grid grid-cols-3 gap-2">
              <div>
                <label class="block text-[10px] text-slate-400 mb-0.5">総G数 *</label>
                <input type="number" id="spins" min="1" placeholder="591" oninput="calcProbabilities()" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-2 py-1.5 text-xs text-white font-mono focus:border-pink-500 focus:outline-none text-center">
              </div>
              <div>
                <label class="block text-[10px] text-amber-400 mb-0.5">BIG回数</label>
                <input type="number" id="bigCount" min="0" value="0" oninput="calcProbabilities()" class="w-full bg-slate-900 border border-amber-500/40 rounded-lg px-2 py-1.5 text-xs text-amber-300 font-mono font-bold focus:border-amber-400 focus:outline-none text-center">
              </div>
              <div>
                <label class="block text-[10px] text-cyan-400 mb-0.5">REG回数</label>
                <input type="number" id="regCount" min="0" value="0" oninput="calcProbabilities()" class="w-full bg-slate-900 border border-cyan-500/40 rounded-lg px-2 py-1.5 text-xs text-cyan-300 font-mono font-bold focus:border-cyan-400 focus:outline-none text-center">
              </div>
            </div>

            <!-- 計算結果バッジ -->
            <div class="grid grid-cols-3 gap-1.5 pt-1 text-center font-mono">
              <div class="bg-slate-900/90 py-1 rounded-lg border border-slate-800">
                <span class="text-[9px] text-slate-400 block">BIG確率</span>
                <span id="badge-big-prob" class="text-[11px] font-bold text-amber-400">1/-</span>
              </div>
              <div class="bg-slate-900/90 py-1 rounded-lg border border-slate-800">
                <span class="text-[9px] text-slate-400 block">REG確率</span>
                <span id="badge-reg-prob" class="text-[11px] font-bold text-cyan-400">1/-</span>
              </div>
              <div class="bg-slate-900/90 py-1 rounded-lg border border-slate-800">
                <span class="text-[9px] text-slate-400 block">合算確率</span>
                <span id="badge-comb-prob" class="text-[11px] font-bold text-pink-400">1/-</span>
              </div>
            </div>
          </div>

          <!-- 着席時の状況 (ハマり・吐き出し枚数) -->
          <div class="bg-slate-950/70 p-3 rounded-xl border border-slate-800 space-y-2">
            <span class="text-[11px] font-bold text-slate-300">やり始め（着席時）の状況</span>
            <div class="grid grid-cols-2 gap-2">
              <div>
                <label class="block text-[10px] text-slate-400 mb-0.5">ハマりゲーム数</label>
                <div class="relative">
                  <input type="number" id="startHama" placeholder="435" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-2 py-1.5 text-xs text-white font-mono focus:border-pink-500 focus:outline-none pr-6">
                  <span class="absolute right-2 top-1.5 text-[10px] text-slate-500">G</span>
                </div>
              </div>
              <div>
                <label class="block text-[10px] text-slate-400 mb-0.5">吐き出し枚数 (差枚)</label>
                <div class="relative">
                  <input type="number" id="startDiff" placeholder="-1400" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-2 py-1.5 text-xs text-white font-mono focus:border-pink-500 focus:outline-none pr-7">
                  <span class="absolute right-2 top-1.5 text-[10px] text-slate-500">枚</span>
                </div>
              </div>
            </div>
          </div>

          <!-- 投資・回収・収支 -->
          <div class="bg-slate-950/70 p-3 rounded-xl border border-slate-800 space-y-2">
            <div class="grid grid-cols-2 gap-2">
              <div>
                <label class="block text-[10px] text-slate-400 mb-0.5">投資額 (円) *</label>
                <input type="number" id="invest" step="500" placeholder="5000" oninput="calcProfit()" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-2.5 py-1.5 text-xs text-white font-mono focus:border-pink-500 focus:outline-none">
              </div>
              <div>
                <label class="block text-[10px] text-slate-400 mb-0.5">回収額 (円) *</label>
                <input type="number" id="payout" step="500" placeholder="25000" oninput="calcProfit()" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-2.5 py-1.5 text-xs text-white font-mono focus:border-pink-500 focus:outline-none">
              </div>
            </div>

            <div class="bg-slate-900/90 p-2.5 rounded-lg border border-slate-800 flex items-center justify-between">
              <span class="text-xs text-slate-400">今回の収支</span>
              <span id="badge-profit" class="text-sm font-black font-mono text-slate-300">±0 円</span>
            </div>
          </div>

          <!-- メモ -->
          <div>
            <label class="block text-[10px] text-slate-400 mb-0.5">実戦メモ / 設定推測 (任意)</label>
            <input type="text" id="memo" placeholder="例: 単独REG良好、チェリー重複多め" class="w-full bg-slate-950 border border-slate-700/80 rounded-xl px-3 py-2 text-xs text-white placeholder-slate-600 focus:border-pink-500 focus:outline-none">
          </div>

          <!-- 送信ボタン -->
          <button type="submit" class="w-full py-3.5 rounded-xl font-bold text-white bg-gradient-to-r from-pink-600 via-rose-600 to-pink-500 shadow-lg shadow-pink-600/30 tap-scale flex items-center justify-center gap-2 text-sm tracking-wide">
            <i data-lucide="check" class="w-4 h-4"></i> 実戦データを保存する
          </button>
        </form>

      </div>
    </section>

    <!-- ================= PAGE 2: レポート ================= -->
    <section id="pane-report" class="space-y-4 hidden">

      <!-- PART 1: 実戦サマリー -->
      <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 shadow-xl">
        <div class="flex items-center justify-between mb-3 border-b border-slate-800 pb-2">
          <h3 class="text-xs font-bold text-pink-400 flex items-center gap-1.5">
            <span class="px-1.5 py-0.5 rounded bg-pink-950 text-pink-300 text-[10px] font-mono border border-pink-700/60">PART 1</span>
            実戦サマリー (最新)
          </h3>
          <span id="summary-badge" class="text-[11px] font-bold px-2 py-0.5 rounded-full bg-slate-800 text-slate-400">未記録</span>
        </div>
        <div id="summary-content" class="space-y-3"></div>
      </div>

      <!-- PART 2: 店舗別データ -->
      <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 shadow-xl">
        <div class="flex items-center justify-between mb-3 border-b border-slate-800 pb-2">
          <h3 class="text-xs font-bold text-amber-400 flex items-center gap-1.5">
            <span class="px-1.5 py-0.5 rounded bg-amber-950 text-amber-300 text-[10px] font-mono border border-amber-700/60">PART 2</span>
            店舗別データ
          </h3>
          <span class="text-[10px] text-slate-400">収支順</span>
        </div>
        <div id="store-cards" class="space-y-2"></div>
      </div>

      <!-- PART 3: 生涯収支推移 -->
      <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 shadow-xl">
        <div class="flex items-center justify-between mb-3 border-b border-slate-800 pb-2">
          <h3 class="text-xs font-bold text-cyan-400 flex items-center gap-1.5">
            <span class="px-1.5 py-0.5 rounded bg-cyan-950 text-cyan-300 text-[10px] font-mono border border-cyan-700/60">PART 3</span>
            生涯収支推移
          </h3>
        </div>

        <!-- 生涯スタッツ -->
        <div class="grid grid-cols-2 gap-2 mb-3">
          <div class="bg-slate-950 p-2.5 rounded-xl border border-slate-800">
            <span class="text-[10px] text-slate-400 block">生涯戦績 (勝率)</span>
            <div class="flex items-baseline gap-1.5">
              <span id="stat-win-loss" class="text-sm font-bold text-white font-mono">0勝 0敗</span>
              <span id="stat-win-rate" class="text-xs font-bold text-amber-400 font-mono">(0.0%)</span>
            </div>
          </div>
          <div class="bg-slate-950 p-2.5 rounded-xl border border-slate-800">
            <span class="text-[10px] text-slate-400 block">生涯累計収支</span>
            <span id="stat-total-profit" class="text-sm font-black font-mono text-white">±0 円</span>
          </div>
        </div>

        <!-- 収支グラフ (単体で美しく表示) -->
        <div class="relative w-full h-56 bg-slate-950/80 p-2 rounded-xl border border-slate-800">
          <canvas id="profitChart"></canvas>
        </div>
      </div>

    </section>

    <!-- ================= PAGE 3: 履歴・検索 ================= -->
    <section id="pane-history" class="space-y-3 hidden">
      <div class="bg-slate-900 border border-slate-800 rounded-2xl p-3 shadow-lg space-y-2">
        <div class="relative">
          <i data-lucide="search" class="w-4 h-4 text-slate-500 absolute left-3 top-2.5"></i>
          <input type="text" id="search-keyword" oninput="renderHistoryList()" placeholder="店舗名や機種名で検索..." class="w-full bg-slate-950 border border-slate-700/80 rounded-xl pl-9 pr-3 py-2 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-pink-500">
        </div>
      </div>

      <div id="history-container" class="space-y-2.5"></div>
    </section>

    <!-- ================= PAGE 4: 立ち回り分析 ================= -->
    <section id="pane-analysis" class="space-y-4 hidden">
      <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 shadow-xl">
        <h2 class="text-sm font-bold text-white mb-1 flex items-center gap-1.5">
          <i data-lucide="sparkles" class="w-4 h-4 text-amber-400"></i>
          蓄積データによる立ち回り分析
        </h2>
        <p class="text-[11px] text-slate-400 mb-4">着席時の差枚・ハマり状況や機種別の相性を解析</p>

        <div id="analysis-content" class="space-y-3"></div>
      </div>
    </section>

  </main>

  <!-- Mobile Bottom Navigation Bar -->
  <footer class="fixed bottom-0 left-0 right-0 z-40 bg-slate-950/95 border-t border-slate-800/90 backdrop-blur-md">
    <div class="max-w-md mx-auto grid grid-cols-4 py-1.5 px-2">
      <button onclick="switchTab('input')" id="nav-input" class="flex flex-col items-center justify-center py-1 text-pink-500 font-bold transition tap-scale">
        <i data-lucide="plus-circle" class="w-5 h-5 mb-0.5"></i>
        <span class="text-[10px]">記録入力</span>
      </button>
      <button onclick="switchTab('report')" id="nav-report" class="flex flex-col items-center justify-center py-1 text-slate-400 transition tap-scale">
        <i data-lucide="file-text" class="w-5 h-5 mb-0.5"></i>
        <span class="text-[10px]">レポート</span>
      </button>
      <button onclick="switchTab('history')" id="nav-history" class="flex flex-col items-center justify-center py-1 text-slate-400 transition tap-scale">
        <i data-lucide="history" class="w-5 h-5 mb-0.5"></i>
        <span class="text-[10px]">実戦履歴</span>
      </button>
      <button onclick="switchTab('analysis')" id="nav-analysis" class="flex flex-col items-center justify-center py-1 text-slate-400 transition tap-scale">
        <i data-lucide="brain" class="w-5 h-5 mb-0.5"></i>
        <span class="text-[10px]">分析</span>
      </button>
    </div>
  </footer>

  <script>
    // ユーザー様ご指定の初回実戦データ
    const INITIAL_RECORDS = [
      {
        id: "rec_1",
        date: "2026-10-23",
        store: "モナコパレス菊陽",
        model: "マイジャグラーV",
        spins: 591,
        bigCount: 6,
        regCount: 2,
        bigProb: "1/98.5",
        regProb: "1/295.5",
        combProb: "1/73.9",
        startHama: 435,
        startDiff: -1400,
        invest: 5000,
        payout: 25000,
        profit: 20000,
        memo: "435Gハマり・差枚-1400枚の台に着席。快勝！"
      }
    ];

    const STORAGE_KEY = "juggler_mobile_app_db_v2";
    let records = [];
    let chartInstance = null;

    window.addEventListener("DOMContentLoaded", () => {
      loadRecords();
      setupTodayDate();
      renderQuickStoreChips();
      calcProbabilities();
      calcProfit();
      refreshAll();
      lucide.createIcons();
    });

    function setupTodayDate() {
      const today = new Date().toISOString().split('T')[0];
      const dateEl = document.getElementById('date');
      if (dateEl) dateEl.value = today;
    }

    function loadRecords() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
          records = JSON.parse(saved);
        } else {
          records = [...INITIAL_RECORDS];
          saveToStorage();
        }
      } catch(e) {
        records = [...INITIAL_RECORDS];
      }
    }

    function saveToStorage() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
      } catch(e) {
        showToast("容量制限エラー");
      }
    }

    function switchTab(name) {
      const tabs = ['input', 'report', 'history', 'analysis'];
      tabs.forEach(t => {
        const pane = document.getElementById(`pane-${t}`);
        const nav = document.getElementById(`nav-${t}`);
        if (t === name) {
          pane.classList.remove('hidden');
          nav.classList.add('text-pink-500', 'font-bold');
          nav.classList.remove('text-slate-400');
        } else {
          pane.classList.add('hidden');
          nav.classList.remove('text-pink-500', 'font-bold');
          nav.classList.add('text-slate-400');
        }
      });
      lucide.createIcons();

      if (name === 'report') renderReport();
      if (name === 'history') renderHistoryList();
      if (name === 'analysis') renderAnalysis();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function calcProbabilities() {
      const spins = parseInt(document.getElementById('spins').value) || 0;
      const big = parseInt(document.getElementById('bigCount').value) || 0;
      const reg = parseInt(document.getElementById('regCount').value) || 0;
      const total = big + reg;

      document.getElementById('badge-big-prob').textContent = (spins > 0 && big > 0) ? `1/${(spins / big).toFixed(1)}` : '1/-';
      document.getElementById('badge-reg-prob').textContent = (spins > 0 && reg > 0) ? `1/${(spins / reg).toFixed(1)}` : '1/-';
      document.getElementById('badge-comb-prob').textContent = (spins > 0 && total > 0) ? `1/${(spins / total).toFixed(1)}` : '1/-';
    }

    function calcProfit() {
      const invest = parseInt(document.getElementById('invest').value) || 0;
      const payout = parseInt(document.getElementById('payout').value) || 0;
      const diff = payout - invest;
      const el = document.getElementById('badge-profit');
      el.textContent = `${diff > 0 ? '+' : ''}${diff.toLocaleString()} 円`;
      if (diff > 0) el.className = "text-sm font-black font-mono text-emerald-400";
      else if (diff < 0) el.className = "text-sm font-black font-mono text-rose-400";
      else el.className = "text-sm font-black font-mono text-slate-300";
    }

    function renderQuickStoreChips() {
      const stores = [...new Set(records.map(r => r.store))].slice(0, 4);
      const container = document.getElementById('quickStores');
      const datalist = document.getElementById('storeList');
      if (datalist) {
        datalist.innerHTML = stores.map(s => `<option value="${s}">`).join('');
      }
      if (!container) return;
      if (stores.length === 0) {
        container.innerHTML = '';
        return;
      }
      container.innerHTML = stores.map(s => `
        <button type="button" onclick="setStoreName('${s}')" class="text-[10px] px-2 py-0.5 rounded-md bg-slate-800 text-slate-300 border border-slate-700 hover:border-pink-500 tap-scale">
          ${s}
        </button>
      `).join('');
    }

    function setStoreName(name) {
      document.getElementById('store').value = name;
    }

    function saveRecord(e) {
      e.preventDefault();
      const spins = parseInt(document.getElementById('spins').value) || 0;
      const big = parseInt(document.getElementById('bigCount').value) || 0;
      const reg = parseInt(document.getElementById('regCount').value) || 0;
      const invest = parseInt(document.getElementById('invest').value) || 0;
      const payout = parseInt(document.getElementById('payout').value) || 0;
      const profit = payout - invest;

      const record = {
        id: "rec_" + Date.now(),
        date: document.getElementById('date').value,
        store: document.getElementById('store').value.trim(),
        model: document.getElementById('model').value,
        spins: spins,
        bigCount: big,
        regCount: reg,
        bigProb: (spins > 0 && big > 0) ? `1/${(spins / big).toFixed(1)}` : '1/-',
        regProb: (spins > 0 && reg > 0) ? `1/${(spins / reg).toFixed(1)}` : '1/-',
        combProb: (spins > 0 && (big + reg) > 0) ? `1/${(spins / (big + reg)).toFixed(1)}` : '1/-',
        startHama: document.getElementById('startHama').value ? parseInt(document.getElementById('startHama').value) : null,
        startDiff: document.getElementById('startDiff').value ? parseInt(document.getElementById('startDiff').value) : null,
        invest: invest,
        payout: payout,
        profit: profit,
        memo: document.getElementById('memo').value.trim()
      };

      records.unshift(record);
      records.sort((a, b) => new Date(b.date) - new Date(a.date));
      saveToStorage();
      renderQuickStoreChips();

      showToast("実戦レポートを保存しました！");
      document.getElementById('recordForm').reset();
      setupTodayDate();
      calcProbabilities();
      calcProfit();

      setTimeout(() => switchTab('report'), 400);
    }

    function refreshAll() {
      renderReport();
      renderHistoryList();
      renderAnalysis();
    }

    function renderReport() {
      renderSummary();
      renderStoreData();
      renderLifetimeChart();
    }

    // PART 1: サマリー
    function renderSummary() {
      const container = document.getElementById('summary-content');
      const badge = document.getElementById('summary-badge');
      if (!records || records.length === 0) {
        badge.textContent = "未記録";
        container.innerHTML = `<p class="text-xs text-slate-500 text-center py-4">データがありません</p>`;
        return;
      }
      const r = records[0];
      const isWin = r.profit > 0;
      const isDraw = r.profit === 0;

      badge.textContent = isWin ? '勝利 (+)' : (isDraw ? '引分 (±0)' : '敗北 (-)');
      badge.className = `text-[10px] font-bold px-2 py-0.5 rounded-full ${
        isWin ? 'bg-emerald-950 text-emerald-400 border border-emerald-600' :
        isDraw ? 'bg-slate-800 text-slate-300' :
        'bg-rose-950 text-rose-400 border border-rose-600'
      }`;

      const diffCoins = Math.round(r.profit / 20);

      container.innerHTML = `
        <div class="bg-slate-950 p-3 rounded-xl border border-slate-800 text-xs space-y-1">
          <div class="flex justify-between items-center">
            <span class="text-white font-bold text-sm">${r.store}</span>
            <span class="text-slate-400 font-mono">${r.date}</span>
          </div>
          <div class="flex justify-between text-slate-300">
            <span class="text-pink-300 font-semibold">${r.model}</span>
            <span class="font-mono text-white">${r.spins.toLocaleString()} G</span>
          </div>
        </div>

        <div class="grid grid-cols-3 gap-1.5 text-center font-mono">
          <div class="bg-slate-950 p-2 rounded-lg border border-slate-800">
            <span class="text-[9px] text-slate-400 block">BIG (${r.bigCount})</span>
            <span class="text-xs font-bold text-amber-300">${r.bigProb}</span>
          </div>
          <div class="bg-slate-950 p-2 rounded-lg border border-slate-800">
            <span class="text-[9px] text-slate-400 block">REG (${r.regCount})</span>
            <span class="text-xs font-bold text-cyan-300">${r.regProb}</span>
          </div>
          <div class="bg-slate-950 p-2 rounded-lg border border-slate-800">
            <span class="text-[9px] text-slate-400 block">合算</span>
            <span class="text-xs font-bold text-pink-400">${r.combProb}</span>
          </div>
        </div>

        <div class="bg-slate-950 p-3 rounded-xl border border-slate-800 text-xs space-y-1.5">
          <div class="flex justify-between">
            <span class="text-slate-400">着席時ハマり / 吐き出し:</span>
            <span class="text-white font-mono font-bold">
              ${r.startHama !== null ? r.startHama + 'G' : '-'} / 
              <span class="${r.startDiff < 0 ? 'text-cyan-400' : 'text-slate-200'}">${r.startDiff !== null ? (r.startDiff > 0 ? '+' : '') + r.startDiff + '枚' : '-'}</span>
            </span>
          </div>
          <div class="flex justify-between">
            <span class="text-slate-400">投資 / 回収:</span>
            <span class="text-white font-mono">${r.invest.toLocaleString()}円 / ${r.payout.toLocaleString()}円</span>
          </div>
          <div class="flex justify-between items-center border-t border-slate-800 pt-1.5">
            <span class="text-slate-300 font-bold">最終収支:</span>
            <span class="font-mono text-sm font-black ${isWin ? 'text-emerald-400' : (isDraw ? 'text-slate-300' : 'text-rose-400')}">
              ${r.profit > 0 ? '+' : ''}${r.profit.toLocaleString()} 円 (${diffCoins > 0 ? '+' : ''}${diffCoins}枚)
            </span>
          </div>
        </div>

        ${r.memo ? `
          <div class="text-[11px] text-slate-400 bg-slate-950/60 p-2 rounded-lg border border-slate-800 flex gap-1.5 items-start">
            <i data-lucide="message-square" class="w-3.5 h-3.5 text-pink-400 flex-shrink-0 mt-0.5"></i>
            <span>${r.memo}</span>
          </div>
        ` : ''}
      `;
      lucide.createIcons();
    }

    // PART 2: 店舗別データ
    function renderStoreData() {
      const container = document.getElementById('store-cards');
      if (!records || records.length === 0) {
        container.innerHTML = `<p class="text-xs text-slate-500 text-center py-2">データなし</p>`;
        return;
      }

      const map = {};
      records.forEach(r => {
        if (!map[r.store]) map[r.store] = { name: r.store, games: 0, wins: 0, losses: 0, profit: 0 };
        map[r.store].games += 1;
        map[r.store].profit += r.profit;
        if (r.profit > 0) map[r.store].wins += 1;
        else if (r.profit < 0) map[r.store].losses += 1;
      });

      const list = Object.values(map).sort((a, b) => b.profit - a.profit);

      container.innerHTML = list.map(s => {
        const rate = ((s.wins / s.games) * 100).toFixed(0);
        const isPlus = s.profit > 0;
        const diffCoins = Math.round(s.profit / 20);

        return `
          <div class="bg-slate-950 p-2.5 rounded-xl border border-slate-800 flex items-center justify-between">
            <div>
              <div class="text-xs font-bold text-white flex items-center gap-1">
                <i data-lucide="map-pin" class="w-3.5 h-3.5 text-pink-500"></i>
                ${s.name}
              </div>
              <div class="text-[10px] text-slate-400 font-mono mt-0.5">
                ${s.games}戦 ${s.wins}勝 ${s.losses}敗 (勝率 <span class="${rate >= 50 ? 'text-amber-400 font-bold' : ''}">${rate}%</span>)
              </div>
            </div>
            <div class="text-right">
              <div class="font-mono text-xs font-bold ${isPlus ? 'text-emerald-400' : (s.profit < 0 ? 'text-rose-400' : 'text-slate-400')}">
                ${isPlus ? '+' : ''}${s.profit.toLocaleString()} 円
              </div>
              <span class="text-[10px] text-slate-500 font-mono">(${diffCoins > 0 ? '+' : ''}${diffCoins}枚)</span>
            </div>
          </div>
        `;
      }).join('');
      lucide.createIcons();
    }

    // PART 3: 生涯収支 & グラフ
    function renderLifetimeChart() {
      let wins = 0;
      let totalProfit = 0;
      records.forEach(r => {
        totalProfit += r.profit;
        if (r.profit > 0) wins++;
      });

      const total = records.length;
      const rate = total > 0 ? ((wins / total) * 100).toFixed(1) : "0.0";

      document.getElementById('stat-win-loss').textContent = `${wins}勝 ${total - wins}敗`;
      document.getElementById('stat-win-rate').textContent = `(${rate}%)`;

      const profitEl = document.getElementById('stat-total-profit');
      profitEl.textContent = `${totalProfit > 0 ? '+' : ''}${totalProfit.toLocaleString()} 円`;
      profitEl.className = `text-sm font-black font-mono ${totalProfit > 0 ? 'text-emerald-400' : (totalProfit < 0 ? 'text-rose-400' : 'text-white')}`;

      // 日付順に並べ替え
      const asc = [...records].sort((a, b) => new Date(a.date) - new Date(b.date));
      const labels = ['開始'];
      const data = [0];
      let acc = 0;

      asc.forEach((r, i) => {
        acc += r.profit;
        labels.push(`${r.date.slice(5)} (#${i+1})`);
        data.push(acc);
      });

      const ctx = document.getElementById('profitChart');
      if (!ctx) return;
      if (chartInstance) chartInstance.destroy();

      const isPositive = data[data.length - 1] >= 0;
      const color = isPositive ? '#10b981' : '#f43f5e';

      chartInstance = new Chart(ctx, {
        type: 'line',
        data: {
          labels: labels,
          datasets: [{
            data: data,
            borderColor: color,
            backgroundColor: isPositive ? 'rgba(16, 185, 129, 0.12)' : 'rgba(244, 63, 94, 0.12)',
            fill: true,
            tension: 0.25,
            borderWidth: 2,
            pointRadius: 3,
            pointBackgroundColor: color
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { display: false },
            tooltip: {
              callbacks: {
                label: (ctx) => `累計: ${ctx.parsed.y > 0 ? '+' : ''}${ctx.parsed.y.toLocaleString()}円`
              }
            }
          },
          scales: {
            x: {
              grid: { color: '#1a202c' },
              ticks: { color: '#64748b', font: { size: 9 } }
            },
            y: {
              grid: { color: '#1a202c' },
              ticks: {
                color: '#64748b',
                font: { size: 9 },
                callback: (v) => v.toLocaleString() + '円'
              }
            }
          }
        }
      });
    }

    // 履歴・検索
    function renderHistoryList() {
      const container = document.getElementById('history-container');
      const kw = (document.getElementById('search-keyword')?.value || '').trim().toLowerCase();

      const filtered = records.filter(r => {
        if (!kw) return true;
        return r.store.toLowerCase().includes(kw) || r.model.toLowerCase().includes(kw) || r.date.includes(kw);
      });

      if (filtered.length === 0) {
        container.innerHTML = `<div class="bg-slate-900 p-6 rounded-xl border border-slate-800 text-center text-xs text-slate-500">一致する実戦がありません</div>`;
        return;
      }

      container.innerHTML = filtered.map(r => {
        const isWin = r.profit > 0;
        return `
          <div class="bg-slate-900 border border-slate-800 rounded-xl p-3 shadow space-y-1.5">
            <div class="flex items-center justify-between">
              <div class="flex items-center gap-1.5">
                <span class="text-[10px] font-mono text-slate-400">${r.date}</span>
                <span class="text-xs font-bold text-white">${r.store}</span>
              </div>
              <div class="flex items-center gap-2">
                <span class="text-xs font-bold font-mono ${isWin ? 'text-emerald-400' : (r.profit < 0 ? 'text-rose-400' : 'text-slate-300')}">
                  ${r.profit > 0 ? '+' : ''}${r.profit.toLocaleString()} 円
                </span>
                <button onclick="deleteRecord('${r.id}')" class="text-slate-500 hover:text-rose-400 p-0.5">
                  <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
                </button>
              </div>
            </div>

            <div class="grid grid-cols-3 gap-1 bg-slate-950 p-2 rounded-lg text-[10px] font-mono text-slate-300 text-center">
              <div><span class="text-slate-500">機種:</span> ${r.model.replace('ジャグラー', '')}</div>
              <div><span class="text-slate-500">G数:</span> ${r.spins}G</div>
              <div><span class="text-slate-500">合算:</span> ${r.combProb}</div>
            </div>

            ${(r.startHama !== null || r.startDiff !== null) ? `
              <div class="text-[10px] text-slate-400 flex justify-between px-1">
                <span>着席時: ${r.startHama !== null ? r.startHama + 'Gハマり' : ''}</span>
                <span>差枚: <strong class="${r.startDiff < 0 ? 'text-cyan-400' : ''}">${r.startDiff !== null ? r.startDiff + '枚' : '-'}</strong></span>
              </div>
            ` : ''}
          </div>
        `;
      }).join('');
      lucide.createIcons();
    }

    function deleteRecord(id) {
      if (!window.confirm("この実戦記録を削除しますか？")) return;
      records = records.filter(r => r.id !== id);
      saveToStorage();
      renderQuickStoreChips();
      refreshAll();
      showToast("記録を削除しました");
    }

    // 立ち回り分析
    function renderAnalysis() {
      const container = document.getElementById('analysis-content');
      if (!records || records.length === 0) {
        container.innerHTML = `<p class="text-xs text-slate-500 text-center py-4">データがありません</p>`;
        return;
      }

      // マイナス台着席時の検証
      const minusPlays = records.filter(r => r.startDiff !== null && r.startDiff < 0);
      const minusWins = minusPlays.filter(r => r.profit > 0).length;
      const minusRate = minusPlays.length > 0 ? ((minusWins / minusPlays.length) * 100).toFixed(0) : '-';

      // 機種別
      const modelMap = {};
      records.forEach(r => {
        if (!modelMap[r.model]) modelMap[r.model] = { count: 0, profit: 0, wins: 0 };
        modelMap[r.model].count++;
        modelMap[r.model].profit += r.profit;
        if (r.profit > 0) modelMap[r.model].wins++;
      });

      container.innerHTML = `
        <div class="bg-slate-950 p-3 rounded-xl border border-slate-800 space-y-1">
          <div class="text-xs font-bold text-amber-400 flex items-center gap-1">
            <i data-lucide="crosshair" class="w-3.5 h-3.5"></i>
            吸い込み台（差枚マイナス）リバウンド狙い戦績
          </div>
          <div class="text-base font-black font-mono text-white mt-1">
            勝率 ${minusRate}% <span class="text-xs font-normal text-slate-400">(${minusWins}勝 / ${minusPlays.length}戦)</span>
          </div>
          <p class="text-[10px] text-slate-400">
            やり始めがマイナス域の台に着席した際の実績です。
          </p>
        </div>

        <div class="bg-slate-950 p-3 rounded-xl border border-slate-800 space-y-2">
          <div class="text-xs font-bold text-slate-300">機種別 収支ランキング</div>
          <div class="space-y-1.5">
            ${Object.entries(modelMap).map(([name, d]) => `
              <div class="flex justify-between items-center text-xs border-b border-slate-800/80 pb-1 last:border-none">
                <div>
                  <span class="font-bold text-white">${name}</span>
                  <span class="text-[10px] text-slate-400 block">${d.count}戦 (勝率 ${((d.wins/d.count)*100).toFixed(0)}%)</span>
                </div>
                <div class="font-mono font-bold ${d.profit > 0 ? 'text-emerald-400' : 'text-rose-400'}">
                  ${d.profit > 0 ? '+' : ''}${d.profit.toLocaleString()} 円
                </div>
              </div>
            `).join('')}
          </div>
        </div>
      `;
      lucide.createIcons();
    }

    function exportData() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(records, null, 2));
      const a = document.createElement('a');
      a.setAttribute("href", dataStr);
      a.setAttribute("download", `juggler_records_${new Date().toISOString().split('T')[0]}.json`);
      document.body.appendChild(a);
      a.click();
      a.remove();
      showToast("バックアップを保存しました");
    }

    function importData(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(evt) {
        try {
          const parsed = JSON.parse(evt.target.result);
          if (Array.isArray(parsed)) {
            records = parsed;
            saveToStorage();
            refreshAll();
            showToast("データを復元しました！");
          }
        } catch(err) {
          showToast("復元に失敗しました");
        }
      };
      reader.readAsText(file);
      e.target.value = '';
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      document.getElementById('toast-message').textContent = msg;
      toast.classList.remove('opacity-0', 'pointer-events-none');
      setTimeout(() => toast.classList.add('opacity-0', 'pointer-events-none'), 2200);
    }
  </script>
</body>
</html>
